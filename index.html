  <script>
    $(document).ready(function() {

      // Initializing cart array
      const cart = [];

      // Initializing disabled buttons first before buying
      $(".btn[data-name]").prop('disabled', true);
      $(".btn-highlight.text-main.mt-4").prop('disabled', true);

      // If any input with a type of number (item quantity input) has 0 quantity, disable the ADD TO CART buttons. If greater, enable ADD TO CART buttons.
      $("input[type='number']").on("input", function() {
        const quantity = parseInt($(this).val());
        const buyBtn = $(this).siblings(".btn[data-name]");
        buyBtn.prop('disabled', isNaN(quantity) || quantity <= 0);
      });


      function updateCart() {
        $("#cart-items").empty();
        let total = 0;

        cart.forEach(item => {
          const itemTotal = item.price * item.quantity;
          total += itemTotal;

          const cartItem = $(`
                <div class="d-flex justify-content-between align-items-center my-2">
                    <p class="fw-bold">${item.name}</p>
                    <p>${item.quantity}</p>
                </div>
          `);

          $("#cart-items").append(cartItem);
        });

        $("#cart-total").text(`₱${total.toFixed(2)}`);

        // Enable or disable ADD TO CART button
        $(".btn-highlight.text-main.mt-4").prop('disabled', cart.length === 0);
      }

      // Handles the on click function of the ADD TO CART button.
      $(".btn[data-name]").on("click", function() {
        const name = $(this).data("name");
        const price = parseFloat($(this).data("price"));
        const quantityInput = $(this).siblings("input[type='number']");
        const quantity = parseInt(quantityInput.val());

        const existingItem = cart.find(item => item.name === name);

        if (isNaN(quantity) || quantity <= 0) {
            quantityInput.addClass('border-danger');
            setTimeout(() => quantityInput.removeClass('border-danger'), 1000);
            return;
        }

        if(existingItem) {
          existingItem.quantity += quantity;
        } else {
          cart.push({name, price, quantity});
        }

        quantityInput.val('');
        updateCart();
      });

          // Handle PAY button click
    $(".btn-highlight.text-main.mt-4").on("click", function() {
        const paymentAmount = parseFloat($('input[placeholder="Pay Here"]').val());
        const totalAmount = parseFloat($("#cart-total").text().replace(/[^\d.]/g, ""));

        if (isNaN(totalAmount) || totalAmount <= 0) {
            alert("Error: The total amount is invalid.");
            return;
        }

        if (isNaN(paymentAmount) || paymentAmount <= 0) {
            alert("Please enter a valid payment amount.");
            return;
        }

        if (paymentAmount >= totalAmount) {
            const change = paymentAmount - totalAmount;
            alert(`Payment Successful! Here is your ₱${change.toFixed(2)} change.`);
            cart.length = 0;
            $("#cart-items").empty();
            $("#cart-total").text("₱0.00");
            $('input[placeholder="Pay Here"]').val('');
            $(".btn-highlight.text-main.mt-4").prop('disabled', true);
            
        } else {
            alert(`Insufficient payment. Please add ₱${(totalAmount - paymentAmount).toFixed(2)} more.`);
        }
    });

    });
  </script>
